<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="دفتر كلماتي - اكتب كلماتك وملاحظاتك وشروحاتك في مكان واحد">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>دفتر كلماتي</title>
<style>
:root{--bg:#0b1220;--card:#172131;--line:#2a3950;--text:#eef3fb;--muted:#9aa8bb;--accent:#6d9df7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:28px;margin:0}.count{color:var(--muted);font-size:14px;margin-right:10px}.panel,.word{background:var(--card);border:1px solid var(--line);border-radius:18px}
.panel{padding:18px;margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 12px}
textarea,select,input{width:100%;border:1px solid var(--line);background:#121b2a;color:var(--text);border-radius:12px;padding:12px;font:inherit;outline:none}
textarea{min-height:210px;resize:vertical;line-height:1.8}
.writerTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.writerTop label{color:var(--muted);font-size:13px}.toggle{background:#223047;color:var(--text);font-size:22px;width:44px;height:40px;padding:0;line-height:1}
.options{margin-top:12px}.options label{display:block;color:var(--muted);font-size:13px;margin:10px 0 6px}
button{border:0;border-radius:12px;padding:11px 16px;font:inherit;cursor:pointer}.primary{background:var(--accent);color:#07111f;font-weight:700;margin-top:12px;width:100%}
.search{margin:12px 0}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.chip{white-space:nowrap;background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 13px}.chip.active{color:var(--text);border-color:var(--accent)}
.word{padding:17px;margin:10px 0}.wordhead{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}.en{font-size:22px;font-weight:800}.meta{white-space:pre-wrap;color:var(--muted);font-size:14px;line-height:1.8;margin-top:13px}
.tag{border-radius:20px;padding:5px 11px;font-size:12px;border:1px solid currentColor;white-space:nowrap}
.tag-none{color:#9aa8bb}.tag-pronoun{color:#c084fc}.tag-verb{color:#60a5fa}.tag-noun{color:#34d399}.tag-adj{color:#fbbf24}.tag-adv{color:#fb7185}.tag-prep{color:#22d3ee}.tag-link{color:#a78bfa}
.actions{display:flex;gap:8px;margin-top:12px}.small{background:#223047;color:var(--text);padding:8px 11px}.del{background:#3a2026;color:#ffaaaa}
.empty{color:var(--muted);text-align:center;padding:30px}.note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:8px}
#installBtn{display:none;margin-top:10px;background:#263d62;color:#fff;width:100%}
.focus .options,.focus #installBtn,.focus .note{display:none}.focus textarea{min-height:390px}.focus .primary{margin-top:10px}
@media(max-width:520px){h1{font-size:25px}.wordhead{align-items:flex-start}.focus textarea{min-height:330px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>دفتر كلماتي <span class="count" id="count"></span></h1><div>📖</div></div>
<section class="panel" id="writerPanel">
<h2>➕ أضف ملاحظة</h2>
<div class="writerTop">
<label for="content">اكتب كل ما تريد داخل خانة واحدة</label>
<button class="toggle" id="toggleBtn" type="button" onclick="toggleFocus()" aria-label="توسيع مساحة الكتابة">&lt;</button>
</div>
<textarea id="content" placeholder="اكتب ما يخطر في بالك فالحياة لا تتوقف"></textarea>
<div class="options">
<label for="cat">التصنيف</label>
<select id="cat">
<option>غير مصنف</option><option>ضمير</option><option>فعل</option><option>اسم</option><option>صفة</option><option>ظرف/حال</option><option>حرف جر</option><option>روابط</option>
</select>
</div>
<button class="primary" onclick="addNote()">حفظ الملاحظة</button>
<button id="installBtn" onclick="installApp()">📲 إضافة دفتر كلماتي إلى الشاشة الرئيسية</button>
<div class="note">أول كلمة في النص تُستخدم عنوانًا للملاحظة. وإذا كان بعدها رسم صوتي مثل /əˈtʃiːv/ فلن يدخل في العنوان، لكنه يبقى محفوظًا داخل الشرح.</div>
</section>
<input class="search" id="search" placeholder="🔎 ابحث في الكلمات والملاحظات..." oninput="render()">
<div class="chips" id="chips"></div><main id="list"></main>
</div>
<script>
const seed=[];
let words=JSON.parse(localStorage.getItem("myWords")||"null")||seed,active="الكل",deferredPrompt=null;

function save(){localStorage.setItem("myWords",JSON.stringify(words))}

function titleFromText(text){
  let first=(String(text).trim().split(/\s+/)[0]||"");
  first=first.replace(/^["'“”‘’([{]+|["'“”‘’.,!?؛:،)\]}]+$/g,"");
  return first.replace(/^(?:\/[^/]+\/|\[[^\]]+\])$/," ").trim()||"ملاحظة";
}

function addNote(){
  let text=document.getElementById("content").value.trim();
  if(!text){alert("اكتب شيئاً في الملاحظة أولاً");return}
  words.unshift({text,cat:document.getElementById("cat").value});
  save();
  document.getElementById("content").value="";
  render();
}

function del(i){words.splice(i,1);save();render()}

function edit(i){
  let w=words[i];
  let text=prompt("عدّل نص الملاحظة بالكامل:",w.text);
  if(text===null)return;
  text=text.trim();
  if(!text){alert("لا يمكن حفظ ملاحظة فارغة");return}
  let c=prompt("التصنيف:",w.cat||"غير مصنف");
  if(c===null)return;
  w.text=text;w.cat=c.trim()||"غير مصنف";save();render();
}

function categoryClass(cat){
  return ({"ضمير":"tag-pronoun","فعل":"tag-verb","اسم":"tag-noun","صفة":"tag-adj","ظرف/حال":"tag-adv","حرف جر":"tag-prep","روابط":"tag-link","غير مصنف":"tag-none"}[cat]||"tag-none");
}

function render(){
  let q=document.getElementById("search").value.toLowerCase();
  let cats=["الكل",...new Set(words.map(w=>w.cat||"غير مصنف"))];
  document.getElementById("chips").innerHTML=cats.map(c=>`<button class="chip ${c===active?"active":""}" onclick="active=${JSON.stringify(c)};render()">${esc(c)}</button>`).join("");
  let shown=words.map((w,i)=>({w,i})).filter(x=>{
    let hay=(x.w.text||"")+" "+(x.w.cat||"");
    return (active==="الكل"||x.w.cat===active)&&(!q||hay.toLowerCase().includes(q));
  });
  document.getElementById("count").textContent=`${words.length} ملاحظة`;
  document.getElementById("list").innerHTML=shown.length?shown.map(({w,i})=>{
    let title=titleFromText(w.text);
    return `<article class="word"><div class="wordhead"><div><div class="en">${esc(title)}</div></div><span class="tag ${categoryClass(w.cat)}">${esc(w.cat||"غير مصنف")}</span></div><div class="meta">${esc(w.text)}</div><div class="actions"><button class="small" onclick="edit(${i})">تعديل</button><button class="del" onclick="del(${i})">حذف</button></div></article>`
  }).join(""):"<div class=\"empty\">ماكو ملاحظات مطابقة حالياً.</div>";
}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function toggleFocus(){
  let panel=document.getElementById("writerPanel"),btn=document.getElementById("toggleBtn");
  panel.classList.toggle("focus");
  let on=panel.classList.contains("focus");
  btn.innerHTML=on?"&gt;":"&lt;";
  btn.setAttribute("aria-label",on?"إرجاع مساحة الكتابة":"توسيع مساحة الكتابة");
}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBtn").style.display="block"});
async function installApp(){if(!deferredPrompt){alert("إذا ما ظهر التثبيت، افتح قائمة المتصفح واختر «إضافة إلى الشاشة الرئيسية».");return}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("installBtn").style.display="none"}
window.addEventListener("appinstalled",()=>document.getElementById("installBtn").style.display="none");
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
</body>
</html>
