<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="دفتر كلماتي - اكتب ملاحظاتك وأفكارك">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>دفتر كلماتي</title>
<style>
:root{--bg:#0b1220;--card:#172131;--line:#2a3950;--text:#eef3fb;--muted:#9aa8bb;--accent:#6d9df7;--field:#101a2a;--verb:#4ade80;--noun:#60a5fa;--adj:#c084fc;--adv:#fbbf24;--prep:#fb7185;--pronoun:#22d3ee;--link:#a78bfa;--other:#94a3b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:28px;margin:0}.count{color:var(--muted);font-size:14px;margin-right:10px}.panel,.word{background:var(--card);border:1px solid var(--line);border-radius:18px}
.panel{padding:18px;margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 6px}
textarea,select,input{width:100%;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:14px;padding:13px;font:inherit;outline:none}
textarea{min-height:280px;resize:vertical;line-height:1.8}textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.writebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.writebar label{margin:0}
.expandBtn{width:40px;height:36px;padding:0;background:#223047;color:var(--text);font-size:22px;line-height:1}
.writing-panel.expanded textarea{min-height:500px}.writing-panel.expanded .extra-controls{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{border:0;border-radius:12px;padding:11px 16px;font:inherit;cursor:pointer}.primary{background:var(--accent);color:#07111f;font-weight:700;margin-top:12px;width:100%}
.search{margin:12px 0}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.chip{white-space:nowrap;background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 13px}.chip.active{color:var(--text);border-color:var(--accent)}
.word{padding:17px;margin:10px 0}.wordhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.title{font-size:23px;font-weight:800;line-height:1.3}.content{font-size:16px;line-height:1.85;margin-top:13px;white-space:pre-wrap}
.tag{border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.tag-فعل{background:color-mix(in srgb,var(--verb) 18%,transparent);color:var(--verb);border:1px solid var(--verb)}
.tag-اسم{background:color-mix(in srgb,var(--noun) 18%,transparent);color:var(--noun);border:1px solid var(--noun)}
.tag-صفة{background:color-mix(in srgb,var(--adj) 18%,transparent);color:var(--adj);border:1px solid var(--adj)}
.tag-ظرف-حال{background:color-mix(in srgb,var(--adv) 18%,transparent);color:var(--adv);border:1px solid var(--adv)}
.tag-حرف-جر{background:color-mix(in srgb,var(--prep) 18%,transparent);color:var(--prep);border:1px solid var(--prep)}
.tag-ضمير{background:color-mix(in srgb,var(--pronoun) 18%,transparent);color:var(--pronoun);border:1px solid var(--pronoun)}
.tag-روابط{background:color-mix(in srgb,var(--link) 18%,transparent);color:var(--link);border:1px solid var(--link)}
.tag-غير-مصنف{background:color-mix(in srgb,var(--other) 18%,transparent);color:var(--other);border:1px solid var(--other)}
.actions{display:flex;gap:8px;margin-top:13px}.small{background:#223047;color:var(--text);padding:8px 11px}.del{background:#3a2026;color:#ffaaaa}
.empty{color:var(--muted);text-align:center;padding:30px}.note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:8px}
#installBtn{display:none;margin-top:10px;background:#263d62;color:#fff;width:100%}
@media(max-width:520px){.row{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>دفتر كلماتي <span class="count" id="count"></span></h1><div>📖</div></div>

<section class="panel writing-panel" id="writingPanel">
<h2>📝 ورقة جديدة</h2>
<div class="writebar">
<label for="content">اكتب ما يخطر في بالك فالحياة لا تتوقف</label>
<button class="expandBtn" id="expandBtn" type="button" title="مساحة أكبر" onclick="toggleExpand()">−</button>
</div>
<textarea id="content" placeholder="اكتب جملة، فكرة، شرح كامل، ملاحظة...

الكلمة الأولى التي تكتبها ستصبح عنوان هذه الورقة تلقائياً."></textarea>
<div class="extra-controls">
<div class="row">
<div>
<label>التصنيف</label>
<select id="cat">
<option>غير مصنف</option><option>ضمير</option><option>فعل</option><option>اسم</option><option>صفة</option><option>ظرف/حال</option><option>حرف جر</option><option>روابط</option>
</select>
</div>
</div>
<button class="primary" onclick="addNote()">حفظ الورقة</button>
</div>
<button id="installBtn" onclick="installApp()">📲 إضافة دفتر كلماتي إلى الشاشة الرئيسية</button>
<div class="note">الكلمة الأولى من النص تصبح عنوان الورقة، وباقي النص يبقى كمحتوى كامل.</div>
</section>

<input class="search" id="search" placeholder="🔎 ابحث في ملاحظاتك..." oninput="render()">
<div class="chips" id="chips"></div><main id="list"></main>
</div>

<script>
const oldSeed=[
{en:"His",ar:"له / خاص به",note:"ضمير ملكية للمذكر. مثال: This is his book.",cat:"ضمير",pron:"hɪz"},
{en:"Achieve",ar:"يحقق / ينجز",note:"To successfully reach a goal.",cat:"فعل",pron:"əˈtʃiːv"},
{en:"However",ar:"ومع ذلك",note:"تُستخدم لبيان التباين بين فكرتين.",cat:"روابط",pron:"haʊˈevər"}];

function migrateData(){
const raw=JSON.parse(localStorage.getItem("myWords")||"null");
if(!raw)return oldSeed.map(w=>({title:w.en,content:`${w.ar}\n\n${w.note}${w.pron?`\n\nالنطق: ${w.pron}`:""}`,cat:w.cat}));
return raw.map(w=>{
if(w.title!==undefined)return w;
const title=(w.en||"ملاحظة").trim().split(/\s+/)[0]||"ملاحظة";
const parts=[w.ar,w.note,w.pron?`النطق: ${w.pron}`:""].filter(Boolean);
return {title,content:parts.join("\n\n"),cat:w.cat||"غير مصنف"};
});
}
let words=migrateData(),active="الكل",deferredPrompt=null;
save();
function save(){localStorage.setItem("myWords",JSON.stringify(words))}
function addNote(){
const text=document.getElementById("content").value.trim(),category=document.getElementById("cat").value;
if(!text){alert("اكتب شيئاً أولاً");return}
const title=text.split(/\s+/)[0]||"ملاحظة";
words.unshift({title,content:text,cat:category});save();
document.getElementById("content").value="";render();
}
function del(i){words.splice(i,1);save();render()}
function edit(i){
const w=words[i],content=prompt("عدّل محتوى الورقة:",w.content);
if(content===null)return;const trimmed=content.trim();if(!trimmed)return;
w.content=trimmed;w.title=trimmed.split(/\s+/)[0]||"ملاحظة";
const category=prompt("التصنيف (فعل، اسم، صفة، ضمير، ظرف/حال، حرف جر، روابط، غير مصنف):",w.cat||"غير مصنف");
if(category!==null&&category.trim())w.cat=category.trim();save();render();
}
function slug(s){return String(s).replace(/\s+/g,"-").replace(/[\/\\]/g,"")}
function tagClass(cat){return "tag-"+slug(cat)}
function render(){
const q=document.getElementById("search").value.toLowerCase(),cats=["الكل",...new Set(words.map(w=>w.cat||"غير مصنف"))];
document.getElementById("chips").innerHTML=cats.map(c=>`<button class="chip ${c===active?"active":""}" onclick="active=${JSON.stringify(c)};render()">${esc(c)}</button>`).join("");
const shown=words.map((w,i)=>({w,i})).filter(x=>(active==="الكل"||x.w.cat===active)&&(!q||JSON.stringify(x.w).toLowerCase().includes(q)));
document.getElementById("count").textContent=`${words.length} ورقة`;
document.getElementById("list").innerHTML=shown.length?shown.map(({w,i})=>`
<article class="word"><div class="wordhead"><div class="title">${esc(w.title||"ملاحظة")}</div><span class="tag ${tagClass(w.cat||"غير مصنف")}">${esc(w.cat||"غير مصنف")}</span></div>
<div class="content">${esc(w.content||"")}</div><div class="actions"><button class="small" onclick="edit(${i})">تعديل</button><button class="del" onclick="del(${i})">حذف</button></div></article>`).join(""):`<div class="empty">ماكو ملاحظات مطابقة حالياً.</div>`;
}
function toggleExpand(){
const panel=document.getElementById("writingPanel"),btn=document.getElementById("expandBtn");
panel.classList.toggle("expanded");btn.textContent=panel.classList.contains("expanded")?"+":"−";
btn.title=panel.classList.contains("expanded")?"رجوع":"مساحة أكبر";
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBtn").style.display="block"});
async function installApp(){if(!deferredPrompt){alert("إذا ما ظهر التثبيت، افتح قائمة المتصفح واختر «إضافة إلى الشاشة الرئيسية».");return}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("installBtn").style.display="none"}
window.addEventListener("appinstalled",()=>document.getElementById("installBtn").style.display="none");
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
</body>
</html>
