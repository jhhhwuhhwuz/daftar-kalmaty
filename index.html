<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الكلمات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="app-build" content="f934f6f236ee">
<title>دفتر الكلمات اليومي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: fixed top bar (search / theme on the left, menu on the right), one 640px column: tabs, new-sheet card, saved list. Tools open as bottom sheets. */
@property --bg{syntax:'<color>';inherits:true;initial-value:#0b1020}
@property --bar{syntax:'<color>';inherits:true;initial-value:rgba(11,16,32,.84)}
@property --surface{syntax:'<color>';inherits:true;initial-value:#121a2e}
@property --surface-2{syntax:'<color>';inherits:true;initial-value:#18223a}
@property --line{syntax:'<color>';inherits:true;initial-value:#243050}
@property --fg{syntax:'<color>';inherits:true;initial-value:#e8eefc}
@property --muted{syntax:'<color>';inherits:true;initial-value:#8e9bba}
@property --accent{syntax:'<color>';inherits:true;initial-value:#5ea6ff}
@property --accent-ink{syntax:'<color>';inherits:true;initial-value:#06142b}
@property --accent-soft{syntax:'<color>';inherits:true;initial-value:rgba(94,166,255,.14)}
@property --good{syntax:'<color>';inherits:true;initial-value:#3ecf8e}
@property --good-bg{syntax:'<color>';inherits:true;initial-value:rgba(62,207,142,.14)}
@property --bad{syntax:'<color>';inherits:true;initial-value:#ff6b7a}
@property --bad-bg{syntax:'<color>';inherits:true;initial-value:rgba(255,107,122,.14)}
@property --overlay{syntax:'<color>';inherits:true;initial-value:rgba(4,8,18,.62)}
@property --mark-bg{syntax:'<color>';inherits:true;initial-value:#ffd93d}
@property --mark-fg{syntax:'<color>';inherits:true;initial-value:#1b1500}
:root{
  transition:--bg .6s cubic-bezier(.4,0,.2,1),
  --bar .6s cubic-bezier(.4,0,.2,1),
  --surface .6s cubic-bezier(.4,0,.2,1),
  --surface-2 .6s cubic-bezier(.4,0,.2,1),
  --line .6s cubic-bezier(.4,0,.2,1),
  --fg .6s cubic-bezier(.4,0,.2,1),
  --muted .6s cubic-bezier(.4,0,.2,1),
  --accent .6s cubic-bezier(.4,0,.2,1),
  --accent-ink .6s cubic-bezier(.4,0,.2,1),
  --accent-soft .6s cubic-bezier(.4,0,.2,1),
  --good .6s cubic-bezier(.4,0,.2,1),
  --good-bg .6s cubic-bezier(.4,0,.2,1),
  --bad .6s cubic-bezier(.4,0,.2,1),
  --bad-bg .6s cubic-bezier(.4,0,.2,1),
  --overlay .6s cubic-bezier(.4,0,.2,1),
  --mark-bg .6s cubic-bezier(.4,0,.2,1),
  --mark-fg .6s cubic-bezier(.4,0,.2,1);
  --bg:#0b1020;
  --bar:rgba(11,16,32,.84);
  --surface:#121a2e;
  --surface-2:#18223a;
  --line:#243050;
  --fg:#e8eefc;
  --muted:#8e9bba;
  --accent:#5ea6ff;
  --accent-ink:#06142b;
  --accent-soft:rgba(94,166,255,.14);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --overlay:rgba(4,8,18,.62);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  --shadow:0 14px 34px rgba(0,0,0,.5);
  --font-ui:'Tajawal','Bricolage Grotesque',system-ui,sans-serif;
  --font-en:'Bricolage Grotesque','Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eff3fb;
  --bar:rgba(239,243,251,.88);
  --surface:#ffffff;
  --surface-2:#f2f5fc;
  --line:#d8e0f1;
  --fg:#0e1a33;
  --muted:#5b6988;
  --accent:#1c6ee0;
  --accent-ink:#ffffff;
  --accent-soft:rgba(28,110,224,.1);
  --good:#12805a;
  --good-bg:rgba(18,128,90,.12);
  --bad:#c9304a;
  --bad-bg:rgba(201,48,74,.1);
  --overlay:rgba(14,26,51,.38);
  --shadow:0 14px 32px rgba(20,40,90,.16);
  color-scheme:light;
}
html.thm *,html.thm *::before,html.thm *::after{transition:none!important}
:root[data-theme="purple"]{
  --bg:#120b22;
  --bar:rgba(18,11,34,.84);
  --surface:#1b1233;
  --surface-2:#241a42;
  --line:#382a63;
  --fg:#f0eaff;
  --muted:#a898cf;
  --accent:#a78bfa;
  --accent-ink:#1a0b3a;
  --accent-soft:rgba(167,139,250,.16);
  --overlay:rgba(8,4,18,.64);
  --shadow:0 14px 34px rgba(5,0,20,.55);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  color-scheme:dark;
}
:root[data-theme="forest"]{
  --bg:#08140f;
  --bar:rgba(8,20,15,.84);
  --surface:#0f2119;
  --surface-2:#152b21;
  --line:#1f3d2f;
  --fg:#e6f5ec;
  --muted:#8fb3a0;
  --accent:#34d399;
  --accent-ink:#04210f;
  --accent-soft:rgba(52,211,153,.15);
  --overlay:rgba(2,10,6,.64);
  --shadow:0 14px 34px rgba(0,10,5,.55);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  color-scheme:dark;
}
:root[data-theme="ocean"]{
  --bg:#07161c;
  --bar:rgba(7,22,28,.84);
  --surface:#0d2630;
  --surface-2:#12303c;
  --line:#1c4655;
  --fg:#e4f6fb;
  --muted:#8bb4c2;
  --accent:#22d3ee;
  --accent-ink:#032630;
  --accent-soft:rgba(34,211,238,.15);
  --overlay:rgba(2,12,16,.64);
  --shadow:0 14px 34px rgba(0,12,18,.55);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  color-scheme:dark;
}
:root[data-theme="sand"]{
  --bg:#faf3e8;
  --bar:rgba(250,243,232,.9);
  --surface:#fffaf2;
  --surface-2:#f5ebdc;
  --line:#e6d6bc;
  --fg:#2b2116;
  --muted:#7d6b53;
  --accent:#c2410c;
  --accent-ink:#ffffff;
  --accent-soft:rgba(194,65,12,.1);
  --good:#15803d;
  --good-bg:rgba(21,128,61,.12);
  --bad:#c9304a;
  --bad-bg:rgba(201,48,74,.1);
  --overlay:rgba(43,33,22,.38);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  --shadow:0 14px 32px rgba(90,60,20,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--font-ui);-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,.row:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:0}

/* press animation */
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
.tap{animation:press .2s ease-out}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{position:relative;height:56px;max-width:640px;margin:0 auto;padding-inline:16px;display:flex;align-items:center}
.left{position:relative;z-index:1;flex:1;min-width:0;display:flex;align-items:center}
.ibtn{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;line-height:1;overflow:hidden;transition:background .2s,border-color .2s,width .3s cubic-bezier(.2,.8,.2,1),opacity .2s,margin .3s}
.ibtn:hover{border-color:var(--accent)}
.ibtn svg,.snd svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd{color:var(--accent)}
.snd svg{width:18px;height:18px}
#btnSearch{margin-right:8px}
.bar.searching #btnSearch{background:var(--accent-soft);border-color:var(--accent)}
.bar.searching #btnTheme{width:0;opacity:0;border-width:0;pointer-events:none}
.sfield{flex:0 0 0;min-width:0;opacity:0;overflow:hidden;display:flex;align-items:center;gap:8px;pointer-events:none;transition:flex-grow .32s cubic-bezier(.2,.8,.2,1),opacity .22s}
.bar.searching .sfield{flex:1 1 0;opacity:1;pointer-events:auto}
.pill{flex:1;min-width:0;height:40px;padding-inline:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:8px;transition:border-color .2s}
.pill:focus-within{border-color:var(--accent)}
.pill input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:500 16px var(--font-ui)}
.pill input::placeholder{color:var(--muted)}
.title{position:absolute;left:0;right:0;text-align:center;pointer-events:none;font-weight:800;font-size:17px;letter-spacing:.2px;transition:opacity .2s}
.title b{color:var(--accent);font-family:var(--font-en);font-size:19px}
.bar.searching .title{opacity:0}
.menu-anchor{position:relative;z-index:2;flex:none;margin-left:8px}
#btnMenu{font-size:20px}
.menu{position:absolute;top:calc(100% + 10px);right:0;width:min(268px,calc(100vw - 32px));direction:rtl;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);transform-origin:calc(100% - 20px) 0;opacity:0;visibility:hidden;transform:translateY(-12px) scale(.94);transition:opacity .2s ease,transform .28s cubic-bezier(.2,.9,.25,1.08),visibility 0s .28s}
.menu.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.menu::before{content:'';position:absolute;top:-6px;right:14px;width:11px;height:11px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
@keyframes rise{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu.open .mitem{animation:rise .3s both}
.menu.open .mitem:nth-child(1){animation-delay:.04s}
.menu.open .mitem:nth-child(2){animation-delay:.08s}
.menu.open .mitem:nth-child(3){animation-delay:.12s}
.menu.open .mitem:nth-child(4){animation-delay:.16s}
.mitem{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:11px;text-align:start;font-weight:500;font-size:15px;transition:background .15s}
.mitem:hover,.mitem:focus-visible{background:var(--surface-2)}
.mitem .e{width:26px;display:grid;place-items:center;color:var(--accent)}
.mitem .e svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* page */
.wrap{max-width:640px;margin:0 auto;padding:72px 16px 48px;display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tab{height:42px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .lat{font-family:var(--font-en)}
.tab .n{font:700 12px var(--font-en);padding:1px 8px;border-radius:99px;background:rgba(127,127,127,.22);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:16px;font-weight:800}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mini{display:flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.mini button{height:30px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;line-height:1;border-radius:99px;font-size:13.5px;font-weight:800;color:var(--accent);opacity:.6;transition:background .2s,opacity .2s,transform .12s}
.mini button>span{display:block;transform:translateY(1px)}
.mini button:active{transform:scale(.94)}
.mini button[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);opacity:1}
textarea{display:block;width:100%;min-height:104px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:500 16px/1.6 var(--font-en)}
textarea{unicode-bidi:plaintext}
textarea::placeholder{color:var(--muted)}
.ff{display:flex;flex-direction:column;gap:12px}
.ff label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.ff input{display:block;width:100%;height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--fg);font:500 16px/1.4 var(--font-ui)}
.ff input::placeholder{color:var(--muted)}
.ff input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ff textarea{min-height:76px}
.ver{text-align:center;font:600 12px var(--font-en);color:var(--muted);direction:ltr;padding:4px 0 0;opacity:.8}
.foot{display:flex;align-items:center;gap:12px;margin-top:10px}
.hint{flex:1;min-width:0;font-size:12px;line-height:1.5;color:var(--muted)}
.hint.err{color:var(--bad)}
.hint code{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate;color:var(--fg)}
.save{flex:none;height:42px;padding-inline:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800}

/* list */
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s}
.item.open{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-height:56px}
.en{flex:0 1 auto;min-width:0;max-width:46%;direction:ltr;unicode-bidi:isolate;font:700 17px var(--font-en);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snd{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:16px}
.cat{flex:none;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .detail{grid-template-rows:1fr}
.detail-in{overflow:hidden;min-height:0}
.detail-pad{display:flex;flex-direction:column;gap:12px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.d-word{direction:ltr;unicode-bidi:isolate;font:800 24px/1.2 var(--font-en);color:var(--accent);overflow-wrap:anywhere;min-width:0}
.d-play{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{height:36px;padding-inline:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700}
.lbl{font-size:12px;color:var(--muted);margin-bottom:2px}
.val{overflow-wrap:anywhere}
.val.note{padding:10px 12px;background:var(--surface-2);border-radius:10px;font-family:var(--font-en)}
.nl{white-space:pre-wrap;overflow-wrap:anywhere;text-align:start;line-height:1.8}
.nl.sp{height:.6em}
.val.ph{direction:ltr;unicode-bidi:isolate;text-align:right;font-family:var(--font-en)}
.val.none{color:var(--muted)}
.nedit{display:flex;flex-direction:column;gap:8px}
.ne-ph,.ne-in{width:100%;height:42px;padding-inline:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);font:500 16px var(--font-en)}
.ne-ph::placeholder,.ne-in::placeholder{color:var(--muted)}
.ne-ph:focus-visible,.ne-in:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save.sm{height:38px;padding-inline:16px}
.menu.open .mitem:nth-child(5){animation-delay:.2s}
.menu.open .mitem:nth-child(6){animation-delay:.24s}
.menu.open .mitem:nth-child(7){animation-delay:.28s}
.menu.open .mitem:nth-child(8){animation-delay:.32s}
.menu.open .mitem:nth-child(9){animation-delay:.36s}
.menu.open .mitem:nth-child(10){animation-delay:.4s}
.menu.open .mitem:nth-child(11){animation-delay:.44s}
.menu.open .mitem:nth-child(12){animation-delay:.48s}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#ffffff;color:#1f1f1f;border:1px solid #dadce0}
.gbtn svg{width:20px;height:20px;flex:none}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
html{overscroll-behavior:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.exnote{font-size:12px;color:var(--muted)}
.mbadge{margin-inline-start:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:800 12px/22px var(--font-en);text-align:center}
.mbadge[hidden]{display:none}
.srt{font-weight:800;font-size:18px;text-align:center}
.srcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 14px}
.srw{font:800 34px/1.2 var(--font-en);color:var(--accent);overflow-wrap:anywhere}
.srp{font:500 15px var(--font-en);color:var(--muted)}
.sra{font:800 24px/1.5 var(--font-ui)}
.srcard hr{align-self:stretch;border:0;border-top:1px solid var(--line);margin:4px 0}
.srbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srbtns .sbtn{height:50px;justify-content:center;font-size:15px}
.srbtns .sbtn.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
/* bottom tab bar */
.wrap[hidden],.tabbar[hidden]{display:none!important}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .3s}
.tabbar.hide{transform:translateY(calc(100% + 34px));opacity:0;pointer-events:none}
.tb-in{max-width:640px;margin:0 auto;height:62px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding-inline:10px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;color:var(--muted);font-size:11px;font-weight:700;transition:color .2s}
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tb[aria-current="page"]{color:var(--accent)}
.tb[aria-current="page"] svg{transform:translateY(-2px) scale(1.1)}
.wrap{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
#app[dir="ltr"] .menu{direction:ltr}
.pgin{animation:paneIn .35s ease both}
/* profile */
.phero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.pav{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);border:1.5px solid var(--accent)}
.pav{position:relative;overflow:visible}
.pav>svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pav>svg[viewBox="0 0 96 96"]{width:100%;height:100%;fill:initial;stroke:none;border-radius:50%}
.pav>img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pedit{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--surface)}
.pedit svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.avbig{width:112px;height:112px;margin:0 auto}
.avbig>svg:not([viewBox="0 0 96 96"]){width:52px;height:52px}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avp{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);padding:0;overflow:hidden;background:var(--surface);transition:transform .2s,border-color .2s}
.avp svg{display:block;width:100%;height:100%}
.avp[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.avp:active{transform:scale(.92)}
.pwho{flex:1;min-width:0}
.pname{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.psub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.plv{flex:none;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:7px 12px;min-width:62px}
.plv b{display:block;font:800 22px/1 var(--font-en)}
.plv span{font-size:10px;font-weight:700}
.pxp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px}
.pxh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.pxh .t{display:flex;align-items:center;gap:8px}
.pxh .t svg{width:20px;height:20px;fill:#ffb020;stroke:#ffb020;stroke-width:1.5;stroke-linejoin:round}
.xn{font:800 15px var(--font-en);color:var(--accent);direction:ltr}
.xbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.xbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#8b7bff)}
.pgin .xbar i{animation:xfill 1s cubic-bezier(.2,.8,.2,1)}
@keyframes xfill{from{width:0!important}}
.pic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.pic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pbd{display:flex;flex-direction:column;gap:16px}
.psec{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.phd{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;font-weight:800;font-size:15px;text-align:start}
.phd .pt{flex:1}
.chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.psec.open .chev{transform:rotate(180deg)}
.pcol{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.psec.open .pcol{grid-template-rows:1fr}
.pcol>.pbd{min-height:0;overflow:hidden;visibility:hidden;padding:0 14px;transition:visibility .35s,padding .35s}
.psec.open .pcol>.pbd{visibility:visible;padding:4px 14px 16px}

.del{align-self:flex-start;height:36px;padding-inline:14px;border-radius:10px;border:1px solid var(--line);color:var(--bad);font-size:13px;font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

.catedit{display:flex;flex-direction:column;align-items:flex-start}
.catopts{display:flex;flex-wrap:wrap;gap:6px}
.copt{height:34px;padding-inline:14px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:700}
.copt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.m-cat{color:var(--fg);font-weight:700}

#btnSearch svg{grid-area:1/1;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s}
#btnSearch .i-x{opacity:0;transform:rotate(-90deg) scale(.5)}
.bar.searching #btnSearch .i-search{opacity:0;transform:rotate(90deg) scale(.5)}
.bar.searching #btnSearch .i-x{opacity:1;transform:none}
mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:3px;padding:0 1px}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* flashcards */
.fc-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.fc-scene{perspective:1100px}
.fc-scene.slide{animation:fcin .28s ease-out}
@keyframes fcin{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.fc-card{position:relative;height:280px;cursor:pointer;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,.8,.2,1)}
.fc-card.noanim{transition:none}
.fc-scene.flipped .fc-card{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc-back{transform:rotateY(180deg);border-color:var(--accent)}
.fc-c{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-width:0;width:100%}
.fc-word{direction:ltr;unicode-bidi:isolate;font:800 34px/1.2 var(--font-en);color:var(--accent);overflow-wrap:anywhere}
.fc-sm{direction:ltr;unicode-bidi:isolate;font:700 15px var(--font-en);color:var(--accent);overflow-wrap:anywhere}
.fc-ar{font-size:26px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}
.fc-tip{font-size:12px;color:var(--muted)}
.fc-info{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.fc-info .val.note{width:100%;text-align:start}
.fc-snd{position:absolute;top:10px;left:10px;width:36px;height:36px;border-radius:50%}
.fc-ctl{display:flex;gap:8px}
.fbtn{flex:none;height:40px;padding-inline:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.fbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fbtn.main{flex:1;min-width:0;background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fbtn:disabled{opacity:.4;cursor:default}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--overlay);opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translate(-50%,102%);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:18px;font-weight:800}
.sheet-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
@keyframes liIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes paneIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#list.enter .item{animation:liIn .38s cubic-bezier(.2,.8,.2,1) both}
#list.enter .item:nth-child(2){animation-delay:.04s}#list.enter .item:nth-child(3){animation-delay:.08s}#list.enter .item:nth-child(4){animation-delay:.12s}#list.enter .item:nth-child(5){animation-delay:.16s}#list.enter .item:nth-child(6){animation-delay:.2s}#list.enter .item:nth-child(n+7){animation-delay:.24s}
.pane-in{animation:paneIn .28s ease both}
.sheet-body.swap>*{animation:paneIn .3s ease both}
.wscene{perspective:1200px}
.wcard{display:grid;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.wscene.flipped .wcard{transform:rotateY(180deg)}
.wscene.nofx .wcard{transition:none}
.wface{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px 18px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.wback{background:radial-gradient(circle at 30% 20%,rgba(94,166,255,.35),transparent 55%),linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--accent);cursor:pointer;width:100%;color:var(--fg)}
.wback .gift{font-size:64px;line-height:1;animation:wfloat 2.6s ease-in-out infinite}
.wback h3{font-size:20px;font-weight:800}

.wback .go{margin-top:6px;padding:10px 26px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:800}
@keyframes wfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.wfront{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--line);justify-content:flex-start;gap:10px}
.wfront .day{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.wfront .big{font:800 38px/1.15 var(--font-en);color:var(--fg);direction:ltr;overflow-wrap:anywhere;margin-top:4px}
.wfront .sayb{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center}
.wfront .sayb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wfront .phs{font-family:var(--font-en);direction:ltr;color:var(--muted);font-size:15px}
.wfront hr{width:56px;border:0;height:3px;border-radius:3px;background:var(--accent-soft);margin:4px 0}
.wfront .arb{font-size:24px;font-weight:800;line-height:1.5}
.wfront .nt{font-size:13.5px;color:var(--muted);line-height:1.7;max-height:150px;overflow:auto;width:100%;text-align:start}
.wfront .chips2{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:auto}
.wfront .chips2 span{font-size:12px;padding:3px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

.btn-main.nextb{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:56px;font-size:17px;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.45);animation:paneIn .25s ease both;margin-top:4px}
.dict{display:flex;flex-direction:column;gap:8px}
.dict input{display:block;width:100%;height:50px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--fg);font:600 18px var(--font-en);direction:ltr;text-align:center}
.dict input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dict input:disabled{opacity:.7}
.dres{min-height:22px;font-size:14px;line-height:1.7;text-align:center}
.dres.ok{color:var(--good)}.dres.bad{color:var(--bad)}.dres.warn{color:#eab308}
.dres mark.miss{background:#eab308;color:#1b1500;border-radius:4px;padding:0 3px}
.dres b{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate}
.fc-word.arm{font:800 28px/1.4 var(--font-ui);color:var(--fg);direction:rtl}
.trow{display:flex;flex-direction:column;gap:6px}
.trw{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.trw b{font:800 17px var(--font-en);color:var(--accent);direction:ltr}
.trw span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streak{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(255,138,43,.16),rgba(255,138,43,.04));border:1px solid rgba(255,138,43,.35);border-radius:16px;padding:14px}
.streak .fire{font-size:40px;line-height:1;filter:drop-shadow(0 2px 8px rgba(255,120,30,.45))}
.streak .fire.off{filter:grayscale(1) opacity(.5);animation:none}
.streak .fire[data-act]{cursor:pointer;-webkit-user-select:none;user-select:none}
.streak .fire[data-act].rekindle{transform-origin:50% 90%;animation:fireRe .85s cubic-bezier(.2,1.2,.4,1) both}
@keyframes fireRe{0%{transform:scale(.55) rotate(-8deg);filter:brightness(1.9) drop-shadow(0 0 0 rgba(255,140,40,0))}45%{transform:scale(1.22) rotate(4deg);filter:brightness(1.35) drop-shadow(0 0 16px rgba(255,150,50,.9))}70%{transform:scale(.97) rotate(-2deg)}100%{transform:none;filter:drop-shadow(0 2px 8px rgba(255,120,30,.45))}}
.streak.ignite{animation:strkGlow 1.6s ease-out}
.streak.ignite .fire{transform-origin:50% 90%;animation:fireIn 1s cubic-bezier(.2,1.4,.4,1) both,fireFlick 1.1s ease-in-out 1s 2}
.streak.ignite .sn b{display:inline-block;animation:numPop .6s cubic-bezier(.2,1.5,.4,1) .45s both}
@keyframes fireIn{0%{transform:scale(0) translateY(14px) rotate(-14deg);opacity:0;filter:drop-shadow(0 0 0 rgba(255,120,30,0)) brightness(2)}55%{transform:scale(1.5) translateY(-4px) rotate(7deg);opacity:1;filter:drop-shadow(0 0 22px rgba(255,140,40,.95)) brightness(1.4)}100%{transform:none;opacity:1;filter:drop-shadow(0 2px 8px rgba(255,120,30,.45))}}
@keyframes fireFlick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08,1.14) rotate(-3deg)}65%{transform:scale(.97,1.05) rotate(3deg)}}
@keyframes numPop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes strkGlow{0%{box-shadow:0 0 0 0 rgba(255,138,43,0)}35%{box-shadow:0 0 28px 2px rgba(255,138,43,.45)}100%{box-shadow:0 0 0 0 rgba(255,138,43,0)}}
.streak .sn b{font:800 30px/1 var(--font-en);color:#ff9a3c}
.streak .sn span{font-size:13px;color:var(--muted);margin-inline-start:6px}
.streak .sm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.sdots{display:flex;gap:5px;margin-top:8px}
.sdots i{width:20px;height:20px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font:700 10px/18px var(--font-en);text-align:center;color:var(--muted);font-style:normal}
.sdots i.on{background:#ff9a3c;border-color:#ff9a3c;color:#2a1300}
.alertc{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.4);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.alertc h4{font-size:15px;font-weight:800;margin:0}
.alertc p{font-size:13.5px;line-height:1.7;color:var(--fg);margin:0}
.stale{flex:none;font-size:11px;font-weight:700;color:#eab308;background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.35);padding:1px 8px;border-radius:99px;white-space:nowrap}
.mbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.mbar i{display:block;height:100%}
.lgd{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.lgd span{display:inline-flex;align-items:center;gap:4px}
.lgd i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mtabs{align-self:flex-start}
#gcv{display:block;width:100%;height:440px;touch-action:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:grab}
.gstat{min-height:16px;font-size:12px;color:var(--muted)}
.le{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-inline-end:4px;text-decoration:none}
.le.s{border-top-style:dashed}.le.f{border-top:2px dashed #a78bfa}.le.a{border-top:2px dotted #22d3ee}.le.b{border-top:3px solid #fbbf24}
.gnb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.gnb span{font-size:12px;color:var(--muted)}
.gnb .pbtn{height:30px;padding-inline:10px;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-en);direction:ltr}

.ginfo{min-height:44px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.ginfo .g-en{font:800 16px var(--font-en);color:var(--accent);direction:ltr;display:inline-block}
.famsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.famsel .pbtn{direction:ltr}.famsel .pbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}.famsel small{opacity:.7;margin-inline-start:3px}
.famwrap{background:radial-gradient(circle at 50% 50%,rgba(99,140,255,.14),transparent 70%),var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:10px}
.famsvg{width:100%;height:auto;display:block;max-height:430px}
.fe{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 6;opacity:.75;animation:fflow 1.4s linear infinite}
@keyframes fflow{to{stroke-dashoffset:-22}}
.fr{fill:none;stroke:var(--line);stroke-dasharray:2 7;opacity:.6}
.fglow{fill:var(--accent);opacity:.16;animation:fpulse 2.6s ease-in-out infinite;transform-origin:180px 180px}
@keyframes fpulse{50%{transform:scale(1.5);opacity:.04}}
.fn{cursor:pointer}.fn rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2;transition:stroke .2s}
.fn text{fill:var(--fg);font:700 13px var(--font-en);direction:ltr}
.fn.sel rect{stroke:var(--accent);stroke-width:2.4}.fn:active rect{stroke:var(--accent)}
.fcmp{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px}.fcmp.two{grid-template-columns:1fr 1fr}
.fcol{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.fcw{font:800 17px var(--font-en);direction:ltr;text-align:start}.fcp{font:500 12px var(--font-en);color:var(--muted);direction:ltr}.fcm{font-weight:700}
.fcl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}.fcl i{width:9px;height:9px;border-radius:50%}
.fcn{font-size:13px;overflow-wrap:anywhere}.fcn.dim{color:var(--muted)}.fcb{display:flex;gap:6px;flex-wrap:wrap}

.auBtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-inline-end:5px}
.auBtn.has{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.auhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.auhead .en{font:800 22px var(--font-en)}.auhead .ar{color:var(--muted);font-weight:700}

.auopt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:16px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--fg);transition:transform .15s,border-color .2s}
.auopt:active{transform:scale(.97);border-color:var(--accent)}.auopt small{color:var(--muted);font-size:12px}

.aucard,.aurec,.autips{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.aucard.draft{border-color:var(--accent)}.aut{font-weight:800}
.aurow{display:flex;align-items:center;gap:12px}
.auplay{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.auplay svg{grid-area:1/1;width:22px;height:22px;fill:var(--accent-ink)}.auplay .ps{display:none}.auplay.on .ps{display:block}.auplay.on .pl{display:none}
.auwave{flex:1;min-width:0;width:100%;height:64px;display:block;cursor:pointer}
.auwave.live{cursor:default;height:80px}
.aumeta{display:flex;justify-content:space-between;color:var(--muted);font:600 12px var(--font-en);padding:0 4px}
.auchips{display:flex;gap:6px;flex-wrap:wrap}.auchips span{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px 10px}

var DIA=/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/;
function normMap(str){
  var out='',map=[];
  for(var i=0;i<str.length;i++){
    var c=str.charAt(i);
    if(DIA.test(c))continue;
    c=c.toLowerCase();
    if('\u0623\u0625\u0622\u0671'.indexOf(c)>-1)c='\u0627';
    else if(c==='\u0649')c='\u064A';
    for(var k=0;k<c.length;k++){out+=c.charAt(k);map.push(i)}
  }
  return {s:out,map:map};
}

function hl(text){
  text=String(text);

  while((idx=nm.s.indexOf(query,from))>-1){
    var st=nm.map[idx],en=nm.map[idx+query.length-1]+1;
    while(en<text.length&&DIA.test(text.charAt(en)))en++;
    ranges.push([st,en]);from=idx+query.length;
  }
  if(!ranges.length)return esc(text);
  var out='',p=0;
  ranges.forEach(function(r){
    if(r[0]<p)r[0]=p;
    if(r[1]<=r[0])return;
    out+=esc(text.slice(p,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'</mark>';p=r[1];

}

var AR=/[؀-ۿ]/,LAT=/[A-Za-z]/;
function trimSep(x){return x.replace(/^[\s\-–—=:|،,]+|[\s\-–—=:|،,]+$/g,'')}
/* كتابة حرة: أي نص يُقبل. السطر الأول هو الكلمة، والمعنى يؤخذ من نفس السطر أو من السطر التالي، والباقي ملاحظة. */
var FLAG=/\uD83C[\uDDE6-\uDDFF]\uD83C[\uDDE6-\uDDFF]/g;
var IPA=/[æðŋœɐ-˿θᴀ-ᶿ]/;
var PH_SRC='(\\/[^\\/\\n\\u0600-\\u06FF]{2,40}\\/|\\[[^\\]\\n\\u0600-\\u06FF]{2,40}\\])';
function findPh(str){
  var re=new RegExp(PH_SRC,'g'),m;
  while((m=re.exec(str))){if(IPA.test(m[1]))return m[1]}
  return '';
}
function cleanMeaning(x){return x.replace(/^(تعني|معناها|معنى|المعنى|يعني)\s*[:：\-–]\s*/,'').replace(/[.。]+$/,'').trim()}
function parseFree(text){
  var lines=text.replace(/\r/g,'').split('\n').map(function(x){return x.replace(/\s+$/,'')});
  var first=(lines.shift()||'').trim();
  var ph=findPh(first);
  if(ph)first=first.replace(ph,' ');
  first=first.replace(FLAG,' ').replace(/\s+/g,' ').trim();
  var en=first,ar='',raw='',ia=first.search(AR),il=first.search(LAT);
  if(ia>-1&&il>-1){
    if(il<ia){en=first.slice(0,ia);ar=first.slice(ia)}else{ar=first.slice(0,il);en=first.slice(il)}
    en=trimSep(en);ar=trimSep(ar);
  }else{
    for(var k=0;k<lines.length;k++)if(lines[k].trim()){raw=lines[k].trim();break}
    if(raw)ar=cleanMeaning(raw);
  }
  var notes=lines.join('\n').replace(/^\s*\n/,'').replace(/\s+$/,'');
  if(raw&&notes.trim()===raw)notes='';
  if(!ph&&en){
    var m2=new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*'+PH_SRC).exec(text);
    if(m2&&IPA.test(m2[1]))ph=m2[1];
  }
  return {en:en,ar:ar,ph:ph,notes:notes};
}

var audHas={},audMem={},audDB=null,auId=null;

function audOpen(){
  return new Promise(function(res){
    if(audDB)return res(audDB);
    try{
      var rq=indexedDB.open('wb-audio',1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore('a')};
      rq.onsuccess=function(){audDB=rq.result;res(audDB)};
      rq.onerror=function(){res(null)};
    }catch(e){res(null)}
  });
}
function audTx(mode,fn){
  return audOpen().then(function(db){
    return new Promise(function(res){
      if(!db)return res(fn(null));
      try{var tx=db.transaction('a',mode),st=tx.objectStore('a'),r=fn(st);tx.oncomplete=function(){res(r&&r.result!==undefined?r.result:true)};tx.onerror=tx.onabort=function(){res(null)}}catch(e){res(null)}
    });
  });
}
function audGet(id){return audTx('readonly',function(st){return st?st.get(id):{result:audMem[id]||null}})}

function audDel(id){delete audHas[id];delete audMem[id];return audTx('readwrite',function(st){return st?st.delete(id):null})}
function audInit(){
  audOpen().then(function(db){
    if(!db)return;
    try{var rq=db.transaction('a','readonly').objectStore('a').getAllKeys();rq.onsuccess=function(){var k=rq.result||[];k.forEach(function(x){audHas[x]=1});if(k.length&&typeof render==='function')render()}}catch(e){}
  });
}
function auFmt(sec){sec=Math.max(0,Math.round(sec||0));return Math.floor(sec/60)+':'+('0'+sec%60).slice(-2)}
function auSize(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
function auPeaks(blob){
  return blob.arrayBuffer().then(function(buf){
    var C=window.AudioContext||window.webkitAudioContext;if(!C)throw 0;
    var c=new C();
    return new Promise(function(ok,no){c.decodeAudioData(buf,ok,no)}).then(function(ab){
      var d=ab.getChannelData(0),N=56,step=Math.floor(d.length/N)||1,pk=[],mx=0.0001;
      for(var i=0;i<N;i++){var m=0,a=i*step,b=Math.min(d.length,a+step);for(var j=a;j<b;j+=Math.max(1,step>>6)){var v=Math.abs(d[j]);if(v>m)m=v}pk.push(m);if(m>mx)mx=m}
      try{c.close()}catch(e){}
      return {peaks:pk.map(function(v){return Math.round(v/mx*100)/100}),dur:ab.duration};
    });
  }).catch(function(){var pk=[];for(var i=0;i<56;i++)pk.push(.25+.5*Math.abs(Math.sin(i*.7)));return {peaks:pk,dur:0}});
}
function auDur(url){

}
function auStopPlay(){

function auCur(){return AU.st==='draft'?AU.draft:AU.saved}

function auWave(cv,peaks,prog,live){
  if(!cv)return;
  var cs=getComputedStyle(document.documentElement),acc=cs.getPropertyValue('--accent').trim()||'#5ea6ff',mu=cs.getPropertyValue('--line').trim()||'#243050',bad=cs.getPropertyValue('--bad').trim()||'#ff6b7a';
  var dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||300,h=cv.clientHeight||70;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  var x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
  var n=live?Math.floor(w/6):peaks.length,gap=live?6:w/n,bw=live?3.4:Math.max(2,gap*.56);
  for(var i=0;i<n;i++){
    var v=live?(peaks[peaks.length-n+i]||0):peaks[i],bh=Math.max(4,v*(h-8)),px=live?i*gap+1:i*gap+(gap-bw)/2;
    x.fillStyle=live?bad:((i+.5)/n<=prog?acc:mu);
    x.globalAlpha=live?(.35+.65*i/n):1;
    var y=(h-bh)/2,r=Math.min(bw/2,bh/2);
    x.beginPath();x.moveTo(px+r,y);x.arcTo(px+bw,y,px+bw,y+bh,r);x.arcTo(px+bw,y+bh,px,y+bh,r);x.arcTo(px,y+bh,px,y,r);x.arcTo(px,y,px+bw,y,r);x.closePath();x.fill();
  }
  x.globalAlpha=1;
}

function auAfter(){
  if(AU.st==='rec'){auLiveLoop();return}
  var rec=auCur();
  if(rec){auWave($('#auWave'),rec.peaks,AU.audio&&AU.audio.duration?AU.audio.currentTime/AU.audio.duration:0)}
}
function auLoad(){
  AU.loading=true;AU.st='idle';AU.saved=null;AU.draft=null;
  var id=auId;
  renderSheet();
  audGet(id).then(function(r){
    if(current!=='audio'||auId!==id)return;
    AU.loading=false;AU.saved=r&&r.blob?r:null;
    if(!AU.saved)delete audHas[id];
    renderSheet();
  });
}
function auPrep(){
  var rec=auCur();if(!rec)return null;
  if(AU.audio&&AU.url)return AU.audio;
  AU.url=URL.createObjectURL(rec.blob);
  var a=AU.audio=new Audio(AU.url);
  a.onended=function(){cancelAnimationFrame(AU.raf);syncPlay(false);auTick(true)};
  return a;
}
function syncPlay(on){var b=$('.auplay');if(b)b.classList.toggle('on',!!on)}
function auTick(end){
  var a=AU.audio,rec=auCur();if(!a||!rec)return;
  var d=(isFinite(a.duration)&&a.duration>0)?a.duration:rec.dur||1,p=end?0:a.currentTime/d;
  auWave($('#auWave'),rec.peaks,p);
  var c=$('#auCur');if(c)c.textContent=auFmt(end?0:a.currentTime);
  if(!end&&!a.paused)AU.raf=requestAnimationFrame(function(){auTick()});
}
function auToggle(){
  var a=auPrep();if(!a)return;
  if(a.paused){var pr=a.play();if(pr&&pr.catch)pr.catch(function(){toast('تعذّر تشغيل الصوت')});syncPlay(true);auTick()}
  else{a.pause();syncPlay(false);cancelAnimationFrame(AU.raf)}
}
function auSeek(ev){
  var cv=ev.target.closest('#auWave');if(!cv)return;
  var a=auPrep();if(!a)return;
  var r=cv.getBoundingClientRect(),p=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
  var d=(isFinite(a.duration)&&a.duration>0)?a.duration:(auCur().dur||0);
  if(d){a.currentTime=p*d;auTick();if(a.paused){a.play().catch(function(){});syncPlay(true);auTick()}}
}
function auSetDraft(blob,src,name){
  if(!blob||!blob.size){toast('الصوت فارغ');return}
  if(blob.size>8*1048576){toast('الملف أكبر من 8 MB');return}
  auFree();AU.loading=true;AU.st='draft';AU.saved=AU.saved;renderSheet();
  var u=URL.createObjectURL(blob);
  Promise.all([auPeaks(blob),auDur(u)]).then(function(r){
    try{URL.revokeObjectURL(u)}catch(e){}
    if(current!=='audio')return;
    AU.draft={blob:blob,mime:blob.type,src:src,name:name||'',size:blob.size,peaks:r[0].peaks,dur:r[0].dur||r[1]||0,at:Date.now()};
    AU.loading=false;renderSheet();
  });
}
function auFromFile(f){

}

function auRecStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('هذا المتصفح لا يدعم التسجيل. اختر ملفًا بدلًا منه.');return}
  auFree();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(stream){
    if(current!=='audio'){stream.getTracks().forEach(function(t){t.stop()});return}
    var mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].filter(function(t){try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}})[0]||'';
    var rec;try{rec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream)}catch(e){stream.getTracks().forEach(function(t){t.stop()});toast('تعذّر بدء التسجيل');return}

    rec.ondataavailable=function(e){if(e.data&&e.data.size)AU.chunks.push(e.data)};
    rec.onstop=function(){
      var type=rec.mimeType||mt||'audio/webm',ch=AU.chunks;
      stream.getTracks().forEach(function(t){t.stop()});
      try{if(AU.ctx)AU.ctx.close()}catch(e){}AU.ctx=null;AU.an=null;
      clearInterval(AU.tm);AU.rec=null;AU.stream=null;
      if(AU.cancel||current!=='audio'){AU.st='idle';if(current==='audio')renderSheet();return}
      auSetDraft(new Blob(ch,{type:type}),'rec','');
    };
    try{
      var C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();var src=AU.ctx.createMediaStreamSource(stream);AU.an=AU.ctx.createAnalyser();AU.an.fftSize=256;src.connect(AU.an);
    }catch(e){AU.an=null}
    rec.start(250);AU.st='rec';renderSheet();

      var s=(Date.now()-AU.t0)/1000,el=$('#auTime');if(el)el.textContent=auFmt(s);
      if(s>=AU.max)auRecStop(false);

  }).catch(function(err){
    toast(err&&err.name==='NotAllowedError'?'ما أعطيت صلاحية المايك. فعّلها من إعدادات المتصفح.':'تعذّر الوصول للمايك.');
  });
}
function auRecStop(cancel,silent){

function auLiveLoop(){

var AC=null;
function soundOn(){return pref.sound!==false}
function tone(f,t0,d,g,type,f2){
  var o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime+t0;
  o.type=type||'triangle';o.frequency.setValueAtTime(f,n);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
  a.gain.setValueAtTime(0.0001,n);a.gain.exponentialRampToValueAtTime(g,n+.015);a.gain.exponentialRampToValueAtTime(0.0001,n+d);
  o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d+.05);
}
function chime(k){
  if(!soundOn())return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(k==='good'){tone(659.25,0,.13,.12);tone(987.77,.09,.22,.12)}
    else if(k==='bad'){tone(349.23,0,.15,.26,'triangle');tone(261.63,.14,.15,.26,'triangle');tone(196,.28,.34,.26,'triangle')}
    else if(k==='end'){
      [392,523.25,659.25,783.99].forEach(function(f,i){tone(f,i*.12,.26,.11)});
      [523.25,659.25,783.99,1046.5].forEach(function(f){tone(f,.52,.9,.06,'sine')});
    }
  }catch(e){}
}

var wod=store.get('wb.wod',null);
var WOD_MS=6*3600000;
function pickWod(){
  var today=dk(Date.now());
  if(wod&&wod.at&&Date.now()-wod.at<WOD_MS&&items.some(function(i){return i.id===wod.id}))return;
  var pool=items.filter(function(i){return !i.ex});
  if(!pool.length)pool=items.slice();
  if(!pool.length){wod=null;return}
  pool=pool.slice().sort(function(a,b){return (a.sn||a.ts)-(b.sn||b.ts)}).slice(0,5);
  var it=pool[Math.floor(Math.random()*pool.length)];
  wod={day:today,at:Date.now(),id:it.id,was:Math.floor((Date.now()-(it.sn||it.ts))/DAY)};
  store.set('wb.wod',wod);
  review(it);
}

var LVT=['مبتدئ','متعلّم','مستكشف','متقدّم','محترف','خبير','أسطورة'];
function xpInfo(){
  var xp=0;
  var nr=0;
  items.forEach(function(i){if(i.ex)return;nr++;xp+=(i.lv||0)*4});
  xp+=Math.floor(nr/5);
  xp+=Object.keys(activeSet()).length*2;
  xp+=streakInfo().best*4;
  xp+=(bridges||[]).length*6;
  var L=1;while(50*(L+1)*L<=xp)L++;
  var cur=50*L*(L-1),nxt=50*(L+1)*L;
  return {xp:xp,L:L,cur:cur,nxt:nxt,pct:Math.max(0,Math.min(100,Math.round((xp-cur)/(nxt-cur)*100))),title:LVT[Math.min(L,LVT.length)-1]};
}

  return '<section class="psec'+(op?' open':'')+'" data-k="'+k+'"><button class="phd" data-act="ptog" aria-expanded="'+op+'"><span class="pic">'+ico(ic)+'</span><span class="pt">'+title+'</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="pcol"><div class="pbd">'+body+'</div></div></section>';

var EN_KEYS=Object.keys(EN_DICT).sort(function(a,b){return b.length-a.length});
var EN_RE=new RegExp(EN_KEYS.map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|'),'g');
var AR_ANY=/[؀-ۿ]/;
function trStr(str){
  EN_RULES.forEach(function(r){str=str.replace(r[0],r[1])});
  return str.replace(EN_RE,function(m,off,all){
    var b=all.charAt(off-1),a=all.charAt(off+m.length);
    if(AR_ANY.test(b)||AR_ANY.test(a))return m;
    return EN_DICT[m];
  });
}

  var v=el.getAttribute(a);if(!v||!AR_ANY.test(v))return;

function trTree(root){

function dedupeKeys(){

function gfetch(url,o,txt){

    clearTimeout(timer);
    if(res.ok)return txt?res.text():res.json();
    return res.json().catch(function(){return {}}).then(function(j){
      var er=(j&&j.error)||{},rs=(er.errors&&er.errors[0]&&er.errors[0].reason)||'';

function syncNow(){
  if(!cloud.user||!navigator.onLine)return Promise.resolve();
  if(!tokenValid()){cloud.needAuth=true;refreshAccount();return Promise.resolve()}
  if(cloud.syncing){cloud.again=true;return Promise.resolve()}
  cloud.syncing=true;cloud.err='';refreshAccount();
  var pulled=0,pushed=0;
  return readRemote().then(function(doc){
    var w=doc.words,changed=false;
    Object.keys(w).forEach(function(id){if(applyRemote(id,w[id])){changed=true;pulled++}});
    if(dedupeKeys())changed=true;
    if(changed&&items.some(function(i){return i.ex})&&items.some(function(i){return !i.ex}))items=items.filter(function(i){return !i.ex});
    /* أي كلمة محلية ليست في الملف تُرفع أيضًا، حتى لو لم تُعلَّم قبل ذلك */
    items.forEach(function(i){if(!i.ex&&!w[i.id])dirty[i.id]=1});
    Object.keys(tombs).forEach(function(id){if(!w[id])dirty[id]=1});
    if(changed){persist();render()}
    var snap={},out=0;
    Object.keys(dirty).forEach(function(id){
      var e=entryFor(id);
      if(!e){delete dirty[id];return}
      var r=w[id];

    '<div><div class="sec-t">أمثلة على اختلاف النطق</div><div class="group tbl"><table class="ipa"><tr><th>الكلمة</th><th>أمريكية</th><th>بريطانية</th></tr>'+
      '<tr><td class="l">tomato</td><td class="l">/təˈmeɪtoʊ/</td><td class="l">/təˈmɑːtəʊ/</td></tr>'+
      '<tr><td class="l">schedule</td><td class="l">/ˈskɛdʒuːl/</td><td class="l">/ˈʃɛdjuːl/</td></tr>'+
      '<tr><td class="l">water</td><td class="l">/ˈwɔːtɚ/</td><td class="l">/ˈwɔːtə/</td></tr></table></div></div>'+

}

bodyOn('keydown',function(e){
  if(e.target.id==='dictIn'&&e.key==='Enter'){e.preventDefault();if(!fc.flipped)dictCheck(false);else if(fc.i<fc.order.length-1)fcGo(1);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.id==='fcCard'){e.preventDefault();fc.flipped=!fc.flipped;fcUpdate()}
});
bodyOn('change',function(e){
  if(e.target.id==='auFile'&&e.target.files&&e.target.files[0]){auFromFile(e.target.files[0]);e.target.value=''}
  if(e.target.id==='avFile'&&e.target.files&&e.target.files[0]){avFromFile(e.target.files[0]);e.target.value=''}
  if(e.target.id==='acWord')acSel=e.target.value;
  if(e.target.id==='impFile'&&e.target.files&&e.target.files[0]){
    var fr=new FileReader();
    fr.onload=function(){importData(String(fr.result))};
    fr.onerror=function(){toast('تعذّرت قراءة الملف')};
    fr.readAsText(e.target.files[0]);
  }
});
bodyOn('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='lang')setLang(t.dataset.v);
  else if(a==='theme'){if(THEMES.indexOf(t.dataset.v)>-1){theme=t.dataset.v;store.set('wb.theme',theme);applyTheme(true);renderSheet()}}
  else if(a==='avopen')openSheet('avatar');
  else if(a==='avpick'){avSet({k:'p',id:t.dataset.id});toast('تم تغيير الصورة')}
  else if(a==='avreset'){avSet(null);toast('تمت إزالة الصورة')}
  else if(a==='fire'){t.classList.remove('rekindle');void t.offsetWidth;t.classList.add('rekindle')}
  else if(a==='ptog'){var sec=t.closest('.psec'),o=!sec.classList.contains('open');sec.classList.toggle('open',o);t.setAttribute('aria-expanded',String(o));profOpen[sec.dataset.k]=o}
  else if(a==='chip')goTo(t.dataset.id);
  else if(a==='trestore'){
    var tr=trash.filter(function(x){return x.it.id===t.dataset.id})[0];
    if(tr){var ri=tr.it;ri.upd=Date.now();items.unshift(ri);delete tombs[ri.id];trash=trash.filter(function(x){return x!==tr});saveTrash();touch(ri);render();renderSheet();toast('تم الاسترجاع')}
  }
  else if(a==='tdel'||a==='tempty'){
    try{(a==='tdel'?[t.dataset.id]:trash.map(function(x){return x.it.id})).forEach(audDel)}catch(e){}
    if(t.dataset.sure){
      if(a==='tempty')trash=[];else trash=trash.filter(function(x){return x.it.id!==t.dataset.id});
      saveTrash();renderSheet();toast('تم الحذف نهائيًا');
    }else{
      var old=t.textContent;t.dataset.sure='1';t.textContent='اضغط للتأكيد';
      setTimeout(function(){if(t.isConnected){delete t.dataset.sure;t.textContent=old}},3000);
    }
  }
  else if(a==='wodreveal'){
    if(!wodToday())pickWod();
    var wi2=wodItem();if(wi2){$('#wodFront').innerHTML=wodFront(wi2);var sc=$('#wscene');sc.classList.remove('nofx');void sc.offsetWidth;sc.classList.add('flipped');chime('good')}
  }
  else if(a==='sstart'){var dl2=dueList().slice(0,SR_N);if(dl2.length){sr={ids:dl2.map(function(x){return x.id}),i:0,shown:false,ok:0,done:false};renderSheet();sbody.scrollTop=0}}
  else if(a==='sshow'){sr.shown=true;renderSheet()}
  else if(a==='ssay'){var si3=srItem();if(si3)speak(si3.en)}
  else if(a==='sgood'){var g1=srItem();if(g1){review(g1,true);sr.ok++;chime('good');srNext()}}
  else if(a==='sbad'){var b1=srItem();if(b1){review(b1,false);srNext()}}
  else if(a==='wodsay'){if(wod){var wi=items.filter(function(i){return i.id===wod.id})[0];if(wi)speak(wi.en)}}
  else if(a==='staleq'){
    var sp=shuffle(staleList().filter(function(i){return i.ar})).slice(0,12);
    if(sp.length){if(sheet.hidden)openSheet('quiz');current='quiz';startQuiz(sp);renderSheet();sbody.scrollTop=0;$('#sheetTitle').textContent=TITLES.quiz}
  }
  else if(a==='fsay'){var fi=items.filter(function(x){return x.id===t.dataset.id})[0];if(fi)speak(fi.en,pref.accent)}
  else if(a==='famsel'){famSel=t.dataset.id;famPick=[];renderSheet()}
  else if(a==='fnode'){var fid=t.dataset.id,fx=famPick.indexOf(fid);if(fx>-1)famPick.splice(fx,1);else{famPick.push(fid);if(famPick.length>2)famPick.shift()}renderSheet()}
  else if(a==='fclear'){famPick=[];renderSheet()}
  else if(a==='aurec')auRecStart();
  else if(a==='austop')auRecStop(false);
  else if(a==='aucancel')auRecStop(true);
  else if(a==='auplay')auToggle();
  else if(a==='ausave')auSave();
  else if(a==='audiscard')auDiscard();
  else if(a==='audel')auDelete(t);
  else if(a==='auseek'){}
  else if(a==='gnb'){if(G&&G.select)G.select(t.dataset.id)}
  else if(a==='mapmode'){mapMode=t.dataset.v;if(mapMode==='link')link=null;renderSheet()}
  else if(a==='linknew'){link=null;newPair();renderSheet()}
  else if(a==='linkshow'){mapMode='graph';gsel=link&&link.a.id;renderSheet()}
  else if(a==='linkopen'){
    if(link.busy)return;
    var tx=($('#lkText').value||'').trim();link.text=tx;link.issues=null;
    var nw=tx.split(/\s+/).filter(Boolean).length;
    if(nw<5){link.err='اكتب جملة من 5 كلمات على الأقل.';renderSheet()}
    else if(!hasWord(tx,link.a.en)||!hasWord(tx,link.b.en)){link.err='الجملة لازم تحتوي الكلمتين: '+link.a.en+' و '+link.b.en+'.';renderSheet()}
    else{
      link.err='';link.busy=true;renderSheet();
      var L=link;
      ltCheck(tx).then(function(r){
        L.busy=false;
        if(link!==L)return;
        if(r&&r.issues.length){L.issues=r.issues;L.err='الجملة تحتاج تصحيحًا قبل أن ينفتح الجسر:'}
        else{
          L.ok=true;L.unv=!r;
          bridges.push([L.a.id,L.b.id,tx,Date.now(),r?1:0]);store.set('wb.bridges',bridges);
          review(L.a);review(L.b);toast('انفتح الجسر');
        }
        if(current==='map'&&mapMode==='link')renderSheet();
      });
    }
  }
  else if(a==='bsay'){var bb=bridges[+t.dataset.i];if(bb&&bb[2])speak(bb[2])}
  else if(a==='opt'){
    if(quiz.picked!==null)return;
    var q=quiz.pool[quiz.i];quiz.picked=+t.dataset.i;
    var okq=quiz.opts[quiz.picked]===q.ar;if(okq)quiz.score++;
    review(q,okq);chime(okq?'good':'bad');
    renderSheet();
  }
  else if(a==='next'){quiz.i++;if(quiz.i<quiz.pool.length)prepQ();else chime('end');renderSheet();sbody.scrollTop=0}
  else if(a==='fcmode'){fc.dict=t.dataset.v==='1';pref.fcdict=fc.dict;savePref();fc.flipped=false;fc.res=null;renderSheet()}
  else if(a==='dictgive'){dictCheck(true)}
  else if((a==='fcflip'||a==='fcreveal')&&fc.dict){
    if(!fc.flipped){if(a==='fcreveal')dictCheck(false)}
    else if(a==='fcreveal'){if(fc.i<fc.order.length-1)fcGo(1)}
  }
  else if(a==='fcflip'||a==='fcreveal'){fc.flipped=!fc.flipped;fcUpdate();if(fc.flipped){review(fcItem());if(fc.i===fc.order.length-1&&!fc.done){fc.done=true;chime('end');toast('أكملت المراجعة 🎉')}}}
  else if(a==='fcnext')fcGo(1);
  else if(a==='fcprev')fcGo(-1);
  else if(a==='fcshuffle'){fc.order=shuffle(fc.order);fcJump(0,0)}
  else if(a==='fcsay'){var fi=fcItem();if(fi)speak(fi.en)}
  else if(a==='signin')signIn();
  else if(a==='syncnow'){if(!tokenValid()){requestToken(false)}else{syncNow().then(function(){toast(cloud.err||'تمت المزامنة')})}}
  else if(a==='signout'){
    if(t.dataset.sure){doSignOut()}
    else{
      t.dataset.sure='1';t.textContent='اضغط للتأكيد';
      setTimeout(function(){if(t.isConnected){delete t.dataset.sure;t.textContent='تسجيل الخروج'}},3000);
    }
  }
  else if(a==='export'){
    try{
      var blob=new Blob([backupJSON()],{type:'application/json'});
      var url=URL.createObjectURL(blob),dl=document.createElement('a');
      dl.href=url;dl.download='words-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(dl);dl.click();document.body.removeChild(dl);
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
      toast('جارٍ تنزيل النسخة الاحتياطية');
    }catch(err){toast('تعذّر التنزيل، استخدم نسخ البيانات')}
  }
  else if(a==='copyjson'){copyText(backupJSON())}
  else if(a==='import'){var it2=$('#impText');if(it2&&it2.value.trim())importData(it2.value);else toast('الصق البيانات أو اختر ملفًا أولًا')}
  else if(a==='restart'){startQuiz();renderSheet()}
  else if(a==='qsay')speak(quiz.pool[quiz.i].en);
  else if(a==='accent'){pref.accent=t.dataset.v;savePref();renderSheet();speak(acSel,pref.accent)}
  else if(a==='sound'){pref.sound=t.dataset.v==='1';savePref();renderSheet();chime('good')}
  else if(a==='rate'){pref.rate=parseFloat(t.dataset.v);savePref();renderSheet()}
  else if(a==='try'){var s=$('#acWord');speak(s?s.value:acSel,t.dataset.v)}
});
